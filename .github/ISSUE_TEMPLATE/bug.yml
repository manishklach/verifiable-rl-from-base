name: Bug report
description: Report a reproducible defect in training, evaluation, or verification
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove credentials and provide the smallest reproducible case."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, minimal inputs, and configuration.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Preflight output
      description: Paste `countdown-doctor --config YOUR_CONFIG` output.
      render: json
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Verifier or reward
        - Dataset or split
        - Training
        - Evaluation or metrics
        - Report or demo
        - Packaging or documentation
    validations:
      required: true

