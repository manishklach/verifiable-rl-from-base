[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-rl-from-base"
version = "0.1.0"
description = "Zero-SFT GRPO on Countdown with strict, executable rewards"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Manish KL"}]
dependencies = [
  "accelerate>=1.6.0",
  "datasets>=3.5.0",
  "matplotlib>=3.9.0",
  "peft>=0.15.0",
  "pyyaml>=6.0.0",
  "safetensors>=0.5.0",
  "torch>=2.5.0",
  "transformers>=5.3.0",
  "trl>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.11.0"]
wandb = ["wandb>=0.19.0"]

[project.scripts]
countdown-train = "countdown_rl.train:main"
countdown-eval = "countdown_rl.evaluate:main"
countdown-plot = "countdown_rl.plot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
